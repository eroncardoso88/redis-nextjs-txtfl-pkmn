# docker-compose.dev.yml
version: '3.8'

services:
  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pokemon-nextjs-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - sqlite-data:/app/data
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=/app/data/sqlite.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-key-change-me
    depends_on:
      - redis
    networks:
      - app-network
    # Enable dev tools like debugger
    stdin_open: true
    tty: true

  redis:
    image: redis:alpine
    container_name: pokemon-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes

  # Database admin tools
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pokemon-redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - app-network

  # Data initialization service
  init-data:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pokemon-init-data
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=/app/data/sqlite.db
    depends_on:
      - nextjs-dev
    networks:
      - app-network
    command: >
      bash -c "
        echo 'Waiting for app to start...' &&
        sleep 15 &&
        echo 'Initializing database...' &&
        curl -X POST http://nextjs-dev:3000/api/pokemon/sync &&
        echo 'Database initialization completed' &&
        exit 0
      "

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
  redis-data:
  sqlite-data: